[package]
name = "cadflow"
version = "0.1.1"
description = "CADFlow Orchestrator Client"
authors = ["you"]
edition = "2024"
default-run = "cadflow"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
futures-util = "0.3.30"
once_cell = "1.19.0"
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
notify = "6.1"
winreg = "0.52"
regex = "1.10.4"
fastcdc = "3.1"
sha2 = "0.10"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

